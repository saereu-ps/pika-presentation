  <rect x="276" y="8" width="88" height="88" rx="25" fill="url(#pikaLogoTileDark)"/>
  <polygon points="322.33,28.67 299,56.67 320,56.67 317.67,75.33 341,47.33 320,47.33" fill="#FFFFFF"/>

